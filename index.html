<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trendz Tracker - Student & Admin Login</title>
    <meta name="description" content="Phase 1 foundation for Trendz Abacus students and admins to track Junior Mental Calculation World Championship practice scores." />
    <meta property="og:title" content="Trendz Tracker - Student & Admin Login" />
    <meta property="og:description" content="Phase 1 foundation for Trendz Abacus students and admins." />
    <meta property="og:type" content="website" />
    
    <!-- Design tokens & unified styles -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/experience.css" />
  </head>
  <body>
    <div class="login-page-wrapper">
      <main class="login-card">
        <header class="login-header">
          <div class="login-logo" aria-hidden="true">🧮</div>
          <h1 class="login-title">Trendz Tracker</h1>
          <p class="login-subtitle">Junior Mental Calculation World Championship Practice</p>
        </header>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="student-id" class="form-label">Student ID or Admin ID</label>
            <input
              type="text"
              id="student-id"
              name="studentId"
              class="form-input"
              placeholder="Enter your assigned ID"
              autocomplete="username"
              required
            />
            <span class="form-hint">Enter your assigned ID. No email required.</span>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
          </div>

          <div id="login-error-container" class="banner banner-error" style="display: none; margin-bottom: var(--space-4);" role="alert">
            <span id="login-error-text"></span>
          </div>

          <button type="submit" id="btn-submit-login" class="btn btn-primary btn-full">
            <span id="login-btn-text">Sign In</span>
          </button>
        </form>
      </main>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Login Logic Script (Vanilla JS ES Module) -->
    <script type="module">
      import { loginWithStudentId, redirectByRole } from '/js/auth.js';
      import { requireNoAuth } from '/js/guard.js';
      import { showToast } from '/js/toast.js';

      // Check if already authenticated
      await requireNoAuth();

      const form = document.getElementById('login-form');
      const studentIdInput = document.getElementById('student-id');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('btn-submit-login');
      const btnText = document.getElementById('login-btn-text');
      const errorContainer = document.getElementById('login-error-container');
      const errorText = document.getElementById('login-error-text');

      function showError(msg) {
        errorText.textContent = msg;
        errorContainer.style.display = 'flex';
      }

      function clearError() {
        errorContainer.style.display = 'none';
        errorText.textContent = '';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const studentId = studentIdInput.value.trim();
        const password = passwordInput.value;

        if (!studentId) {
          showError('Please enter your Student ID or Admin ID.');
          studentIdInput.focus();
          return;
        }

        if (!password) {
          showError('Please enter your password.');
          passwordInput.focus();
          return;
        }

        // Show loading state
        submitBtn.disabled = true;
        btnText.innerHTML = '<span class="spinner" style="margin-right: 6px;"></span> Signing In...';

        try {
          const { profile } = await loginWithStudentId(studentId, password);
          showToast('success', `Welcome back, ${profile.full_name}!`);
          setTimeout(() => {
            redirectByRole(profile);
          }, 400);
        } catch (err) {
          showError(err.message || 'Login failed. Please check your credentials.');
          submitBtn.disabled = false;
          btnText.textContent = 'Sign In';
        }
      });
    </script>
    <script type="module" src="/js/navigation.js"></script>
  </body>
</html>
