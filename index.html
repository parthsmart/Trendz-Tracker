<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trendz Tracker - Student & Admin Login</title>
    <meta name="description" content="Phase 1 foundation for Trendz Abacus students and admins to track Junior Mental Calculation World Championship practice scores." />
    <meta property="og:title" content="Trendz Tracker - Student & Admin Login" />
    <meta property="og:description" content="Phase 1 foundation for Trendz Abacus students and admins." />
    <meta property="og:type" content="website" />
    
    <!-- Design tokens & unified styles -->
    <link rel="stylesheet" href="/css/style.css" />
      <!-- Progressive Web App & Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563EB" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trendz Tracker" />
  </head>
  <body>
    <div class="login-page-wrapper">
      <main class="login-card">
        <header class="login-header">
          <div class="login-logo" aria-hidden="true">🧮</div>
          <h1 class="login-title">Trendz Tracker</h1>
          <p class="login-subtitle">Junior Mental Calculation World Championship Practice</p>
        </header>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="student-id" class="form-label">Student ID or Admin ID</label>
            <input
              type="text"
              id="student-id"
              name="studentId"
              class="form-input"
              placeholder="Enter your assigned ID"
              autocomplete="username"
              required
            />
            <span class="form-hint">Enter your assigned ID. No email required.</span>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
          </div>

          <div id="login-error-container" class="banner banner-error" style="display: none; margin-bottom: var(--space-4);" role="alert">
            <span id="login-error-text"></span>
          </div>

          <button type="submit" id="btn-submit-login" class="btn btn-primary btn-full">
            <span id="login-btn-text">Sign In</span>
          </button>

          <!-- Compact Install Option (shown when beforeinstallprompt or iOS Safari is active) -->
          <div id="login-pwa-install-container" class="login-pwa-install-zone" style="display: none; margin-top: var(--space-3); text-align: center;">
            <button
              type="button"
              id="btn-login-pwa-install"
              class="btn btn-ghost btn-sm btn-pwa-install"
              aria-label="Install Trendz Tracker as a web app"
              style="width: 100%; display: none; align-items: center; justify-content: center; gap: 8px; font-size: var(--text-sm); color: var(--primary-blue, #2563EB); border: 1px dashed var(--border-color, #CBD5E1); padding: 8px 12px; border-radius: var(--radius-md, 8px);"
            >
              <svg class="pwa-install-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>Install Trendz Tracker</span>
            </button>
          </div>
        </form>
      </main>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Login Logic Script (Vanilla JS ES Module) -->
    <script type="module">
      import { loginWithStudentId, redirectByRole, sanitizeLiveRoomReturnTo } from '/js/auth.js';
      import { requireNoAuth } from '/js/guard.js';
      import { showToast } from '/js/toast.js';
      import { mountLoginPwaInstall } from '/js/pwaInstall.js';

      // Mount compact PWA install trigger if available
      mountLoginPwaInstall();

      // Check if already authenticated or returning to an intended class/page
      const urlParams = new URLSearchParams(window.location.search);
      const returnTo = sanitizeLiveRoomReturnTo(urlParams.get('returnTo'));
      if (returnTo) {
        const { getCurrentProfile } = await import('/js/auth.js');
        const existingProfile = await getCurrentProfile({ allowCached: true });
        if (existingProfile) {
          window.location.replace(returnTo);
        } else {
          await requireNoAuth();
        }
      } else {
        await requireNoAuth();
      }

      const form = document.getElementById('login-form');
      const studentIdInput = document.getElementById('student-id');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('btn-submit-login');
      const btnText = document.getElementById('login-btn-text');
      const errorContainer = document.getElementById('login-error-container');
      const errorText = document.getElementById('login-error-text');

      function showError(msg) {
        errorText.textContent = msg;
        errorContainer.style.display = 'flex';
      }

      function clearError() {
        errorContainer.style.display = 'none';
        errorText.textContent = '';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const studentId = studentIdInput.value.trim();
        const password = passwordInput.value;

        if (!studentId) {
          showError('Please enter your Student ID or Admin ID.');
          studentIdInput.focus();
          return;
        }

        if (!password) {
          showError('Please enter your password.');
          passwordInput.focus();
          return;
        }

        // Show loading state
        submitBtn.disabled = true;
        btnText.innerHTML = '<span class="spinner" style="margin-right: 6px;"></span> Signing In...';

        try {
          const { profile } = await loginWithStudentId(studentId, password);
          showToast('success', `Welcome back, ${profile.full_name}!`);
          const returnToParam = sanitizeLiveRoomReturnTo(urlParams.get('returnTo'));
          setTimeout(() => {
            if (returnToParam) {
              window.location.replace(returnToParam);
            } else {
              redirectByRole(profile);
            }
          }, 400);
        } catch (err) {
          showError(err.message || 'Login failed. Please check your credentials.');
          submitBtn.disabled = false;
          btnText.textContent = 'Sign In';
        }
      });
    </script>
  </body>
</html>
