<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Competition Practice Stage - Trendz Tracker</title>
    <meta
      name="description"
      content="Desktop Memoriad-style competition practice stage for calendar dates, additions, multiplications, division and square roots on Trendz Tracker."
    />
    <meta property="og:title" content="Competition Practice Stage - Trendz Tracker" />
    <meta
      property="og:description"
      content="Desktop Memoriad-style competition practice stage for calendar dates, additions, multiplications, division and square roots on Trendz Tracker."
    />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      /* Viewport notice for screens narrower than 1000 px */
      .memoriad-narrow-guard {
        display: none;
        max-width: 560px;
        margin: var(--space-8) auto;
        padding: var(--space-6);
        background: var(--bg-surface);
        border: 2px solid var(--border-strong);
        border-radius: var(--radius-lg);
        text-align: center;
      }

      @media (max-width: 999px) {
        .memoriad-narrow-guard {
          display: block;
        }
        #memoriad-desktop-app {
          display: none !important;
        }
      }

      /* Hide site header when stage/concentration mode is active */
      body.memoriad-stage-mode .app-header {
        display: none !important;
      }

      body.memoriad-stage-mode .main-content {
        padding: 0 !important;
      }

      /* Competition Stage Shell: fits 1280x800 without page scrolling */
      .comp-stage-shell {
        height: 100vh;
        max-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg-app);
        overflow: hidden;
        user-select: none;
      }

      .comp-stage-topbar {
        height: 58px;
        min-height: 58px;
        padding: 0 var(--space-5);
        background: var(--bg-surface);
        border-bottom: 2px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
      }

      .comp-timer-display {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 1.55rem;
        font-weight: 800;
        color: var(--color-primary);
        padding: 4px 12px;
        border-radius: var(--radius-md);
        background: var(--color-primary-subtle);
        border: 1px solid var(--color-primary);
        min-width: 104px;
        text-align: center;
      }

      .comp-limit-badge {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--text-main);
        padding: 5px 10px;
        border-radius: var(--radius-md);
        background: var(--bg-surface-subtle);
        border: 1px solid var(--border-strong);
        white-space: nowrap;
      }

      .comp-last10-notice {
        display: none;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.88rem;
        font-weight: 900;
        color: var(--color-danger);
        background: var(--color-danger-subtle);
        border: 2px dashed var(--color-danger);
        outline: 2px solid var(--color-danger);
        outline-offset: 1px;
        padding: 5px 12px;
        border-radius: var(--radius-md);
        white-space: nowrap;
      }

      .comp-last10-notice.is-visible {
        display: inline-flex;
      }

      .comp-stage-body {
        flex: 1;
        min-height: 0;
        padding: var(--space-4) var(--space-5);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Concentration Screen */
      .comp-concentration-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: var(--bg-surface);
        border: 2px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: var(--space-6);
      }

      .comp-concentration-digits {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 6rem;
        line-height: 1;
        font-weight: 900;
        color: var(--color-primary);
        margin: var(--space-4) 0;
      }

      /* Calendar Stage Layout: 3-column list + center active panel */
      .calendar-stage-layout {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: var(--space-4);
      }

      .calendar-list-panel {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: var(--space-3);
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        align-content: start;
      }

      .calendar-list-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 6px 8px;
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-sm);
        background: var(--bg-surface-subtle);
        cursor: pointer;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        transition: background-color 0.1s ease, border-color 0.1s ease;
      }

      .calendar-list-item:hover {
        border-color: var(--color-primary);
      }

      .calendar-list-item.is-answered {
        background: var(--bg-surface);
        border-color: var(--border-strong);
      }

      .calendar-list-item.is-active-highlight {
        background: var(--color-primary-subtle);
        border: 2px solid var(--color-primary);
        border-left: 5px solid var(--color-primary);
        font-weight: 800;
        box-shadow: 0 1px 6px rgba(37, 99, 235, 0.16);
      }

      .calendar-active-panel {
        background: var(--bg-surface);
        border: 2px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: var(--space-5);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .calendar-active-date {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 3.1rem;
        font-weight: 900;
        letter-spacing: 0.03em;
        color: var(--text-main);
        text-align: center;
        padding: var(--space-5) var(--space-3);
        background: var(--bg-surface-subtle);
        border: 2px solid var(--border-strong);
        border-radius: var(--radius-lg);
        margin: var(--space-3) 0;
      }

      .calendar-day-buttons {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
      }

      .calendar-day-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px 4px;
        border: 2px solid var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--bg-surface);
        color: var(--text-main);
        font-weight: 800;
        font-size: var(--text-sm);
        cursor: pointer;
        transition: transform 0.06s ease, background-color 0.1s ease, border-color 0.1s ease;
      }

      .calendar-day-btn:hover {
        background: var(--color-primary-subtle);
        border-color: var(--color-primary);
      }

      .calendar-day-btn.is-selected {
        background: var(--color-primary);
        border-color: var(--color-primary);
        color: #ffffff;
      }

      .calendar-day-btn-key {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 700;
        opacity: 0.82;
        margin-top: 3px;
      }

      /* Additions Stage Layout: 5x2 overview grid + active question workbench */
      .additions-stage-layout {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: var(--space-4);
      }

      .additions-overview-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 8px;
        min-height: 0;
      }

      .additions-mini-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        cursor: pointer;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        overflow: hidden;
      }

      .additions-mini-card:hover {
        border-color: var(--color-primary);
      }

      .additions-mini-card.is-active {
        background: var(--color-primary-subtle);
        border: 2px solid var(--color-primary);
        border-top: 5px solid var(--color-primary);
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.16);
      }

      .additions-mini-rows {
        font-size: 11px;
        line-height: 1.24;
        color: var(--text-muted);
        text-align: right;
        letter-spacing: 0.04em;
      }

      .additions-mini-answer {
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px solid var(--border-strong);
        font-size: 12px;
        font-weight: 800;
        color: var(--text-main);
        text-align: right;
        min-height: 20px;
      }

      .additions-workbench {
        background: var(--bg-surface);
        border: 2px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: var(--space-4);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 0;
      }

      .additions-matrix {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg-surface-subtle);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: var(--space-3) var(--space-4);
      }

      .additions-matrix-row {
        display: grid;
        grid-template-columns: 32px repeat(10, 28px);
        gap: 3px;
        align-items: center;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 1.35rem;
        line-height: 1.32;
        font-weight: 700;
      }

      .additions-row-idx {
        font-size: 11px;
        color: var(--text-dim);
        text-align: right;
        padding-right: 6px;
      }

      .additions-digit-cell {
        text-align: center;
        border-radius: 4px;
        padding: 1px 0;
        color: var(--text-main);
      }

      .additions-digit-cell.is-col-highlighted {
        background: var(--color-primary-subtle);
        color: var(--color-primary);
        font-weight: 900;
        outline: 1px solid var(--color-primary);
      }

      .additions-slots-row {
        display: grid;
        grid-template-columns: repeat(11, 30px);
        gap: 4px;
        justify-content: center;
        margin-top: var(--space-3);
        padding-top: var(--space-3);
        border-top: 2px solid var(--text-main);
      }

      .additions-slot-box {
        height: 40px;
        border: 2px solid var(--border-strong);
        border-radius: var(--radius-sm);
        background: var(--bg-surface);
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 1.35rem;
        font-weight: 800;
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .additions-slot-box.is-cursor {
        background: var(--color-primary-subtle);
        border-color: var(--color-primary);
        border-bottom-width: 5px;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
      }

      /* Step Boxes & Multiplications / Square Roots Workbench */
      .comp-step-box {
        width: 30px;
        height: 28px;
        border: 2px solid var(--border-strong);
        border-radius: 5px;
        background: var(--bg-surface);
        color: var(--color-primary);
        font-family: var(--font-mono);
        font-size: 0.95rem;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.08s ease, border-color 0.08s ease;
      }

      .comp-step-box.is-checked {
        background: var(--color-primary-subtle);
        border-color: var(--color-primary);
        box-shadow: inset 0 -3px 0 var(--color-primary);
      }

      .comp-step-box.is-next-target {
        border-style: dashed;
        border-color: var(--color-primary);
      }

      .mult-matrix-grid {
        display: grid;
        grid-template-columns: 32px repeat(8, 32px);
        gap: 4px;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .mult-digit-cell {
        text-align: center;
        font-size: 1.65rem;
        line-height: 1.35;
        font-weight: 800;
        border-radius: 5px;
        padding: 2px 0;
        color: var(--text-main);
      }

      .mult-digit-cell.is-col-highlighted {
        background: var(--color-primary-subtle);
        color: var(--color-primary);
        font-weight: 900;
        outline: 2px solid var(--color-primary);
      }

      .mult-slots-row {
        display: grid;
        grid-template-columns: repeat(16, 25px);
        gap: 3px;
        justify-content: center;
        margin-top: var(--space-3);
        padding-top: var(--space-3);
        border-top: 2px solid var(--text-main);
      }

      .mult-slots-row .additions-slot-box {
        height: 38px;
        font-size: 1.15rem;
      }

      .roots-matrix-grid {
        display: grid;
        grid-template-columns: 38px repeat(6, 36px);
        gap: 5px;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .roots-radical-sign {
        font-size: 2rem;
        font-weight: 900;
        color: var(--color-primary);
        text-align: right;
        padding-right: 4px;
        line-height: 1;
      }

      .roots-radicand-cell {
        text-align: center;
        font-size: 1.85rem;
        line-height: 1.35;
        font-weight: 800;
        border-top: 3px solid var(--text-main);
        border-radius: 0 0 5px 5px;
        padding: 4px 0 2px 0;
        color: var(--text-main);
      }

      .roots-radicand-cell.is-col-highlighted {
        background: var(--color-primary-subtle);
        color: var(--color-primary);
        font-weight: 900;
        outline: 2px solid var(--color-primary);
      }

      .roots-slots-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: var(--space-3);
        padding-top: var(--space-3);
        border-top: 2px solid var(--text-main);
      }

      .roots-slots-row .additions-slot-box {
        width: 36px;
        height: 44px;
        font-size: 1.45rem;
      }

      .roots-decimal-dot {
        font-family: var(--font-mono);
        font-size: 1.9rem;
        font-weight: 900;
        color: var(--text-main);
        padding: 0 4px;
        line-height: 1;
        user-select: none;
      }

      /* ======================================================================
       * Memoriad-style competition board (light-blue panel, countdown timer,
       * yellow active question, enlarged active problem). Fixed light palette
       * so the board looks the same in light and dark themes.
       * ==================================================================== */
      .memoriad-settings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: var(--space-4);
      }

      .comp-stage-shell.mb-board {
        --mb-bg: #cfe3f7;
        --mb-panel: #e9f3fc;
        --mb-card: #ffffff;
        --mb-line: #8fb3d9;
        --mb-ink: #0f2742;
        --mb-muted: #4a6582;
        --mb-yellow: #fde96b;
        --mb-yellow-soft: #fff6bf;
        --mb-yellow-line: #d7b400;
        --mb-blue: #1f5fa8;
        --mb-cell: 40px;
        background: var(--mb-bg);
        color: var(--mb-ink);
      }

      .mb-board .comp-stage-topbar.mb-topbar {
        height: 76px;
        min-height: 76px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        background: var(--mb-panel);
        border-bottom: 2px solid var(--mb-line);
      }

      .mb-topbar-left {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .mb-stage-label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mb-blue);
      }

      .mb-stage-title {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 1.05rem;
        font-weight: 800;
        color: var(--mb-ink);
      }

      .mb-level-chip {
        font-size: 12px;
        font-weight: 800;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--mb-card);
        border: 1px solid var(--mb-line);
        color: var(--mb-blue);
        white-space: nowrap;
      }

      .mb-topbar-center {
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }

      .mb-board .comp-timer-display.mb-timer {
        font-size: 2.6rem;
        line-height: 1;
        padding: 6px 22px;
        min-width: 170px;
        background: var(--mb-card);
        color: var(--mb-ink);
        border: 2px solid var(--mb-line);
        border-radius: 14px;
        letter-spacing: 0.04em;
      }

      .mb-board .comp-timer-display.mb-timer.is-ending {
        color: #b91c1c;
        border-color: #b91c1c;
        background: #fee2e2;
      }

      .mb-topbar-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--space-2);
      }

      .mb-progress-pill {
        font-size: 12px;
        font-weight: 800;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--mb-card);
        border: 1px solid var(--mb-line);
        color: var(--mb-ink);
        white-space: nowrap;
      }

      .mb-board .btn-outline {
        background: var(--mb-card);
        color: var(--mb-ink);
        border-color: var(--mb-line);
      }

      .mb-board .comp-stage-body {
        padding: var(--space-3) var(--space-5);
        gap: var(--space-3);
      }

      .mb-footer {
        min-height: 60px;
        padding: 0 var(--space-5);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-4);
        background: var(--mb-panel);
        border-top: 2px solid var(--mb-line);
      }

      .mb-keys-hint {
        font-size: 11px;
        color: var(--mb-muted);
        line-height: 1.45;
      }

      .mb-keys-hint code,
      .mb-workbench-hint code {
        background: var(--mb-card);
        border: 1px solid var(--mb-line);
        border-radius: 4px;
        padding: 0 4px;
        color: var(--mb-ink);
      }

      .mb-footer-actions {
        display: flex;
        gap: var(--space-2);
        flex-shrink: 0;
      }

      .mb-btn {
        min-width: 112px;
        padding: 10px 18px;
        font-weight: 900;
        letter-spacing: 0.06em;
        border-radius: 10px;
        border: 2px solid var(--mb-blue);
        background: var(--mb-card);
        color: var(--mb-blue);
      }

      .mb-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .mb-btn-finish {
        background: var(--mb-blue);
        color: #ffffff;
      }

      /* Question card grid (2 rows x 5 cards) */
      .mb-card-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        flex-shrink: 0;
      }

      .mb-card {
        position: relative;
        min-height: 104px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 6px;
        padding: 8px 10px 8px 30px;
        background: var(--mb-card);
        border: 2px solid var(--mb-line);
        border-radius: 10px;
        cursor: pointer;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        color: var(--mb-ink);
        overflow: hidden;
      }

      .mb-card:hover {
        border-color: var(--mb-blue);
      }

      .mb-card.is-active {
        background: var(--mb-yellow);
        border-color: var(--mb-yellow-line);
        box-shadow: 0 0 0 3px rgba(215, 180, 0, 0.35);
      }

      .mb-card-num {
        position: absolute;
        top: 6px;
        left: 8px;
        font-size: 11px;
        font-weight: 900;
        color: var(--mb-muted);
      }

      .mb-card-problem {
        font-size: 15px;
        font-weight: 800;
        text-align: right;
        line-height: 1.35;
        word-break: break-all;
      }

      .mb-card-stack > div:last-child {
        border-bottom: 2px solid var(--mb-ink);
      }

      .mb-card-sign {
        margin-right: 6px;
      }

      .mb-card-inline {
        text-align: center;
      }

      .mb-card-longdiv {
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
      }

      .mb-card-divisor {
        padding-right: 4px;
      }

      .mb-card-dividend {
        border-left: 2px solid var(--mb-ink);
        border-top: 2px solid var(--mb-ink);
        border-top-left-radius: 8px;
        padding: 0 2px 0 6px;
      }

      .mb-card-radical {
        font-size: 1.15em;
      }

      .mb-card-radicand {
        border-top: 2px solid var(--mb-ink);
      }

      .mb-card-answer {
        min-height: 24px;
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--mb-panel);
        border: 1px solid var(--mb-line);
        text-align: right;
        font-size: 14px;
        font-weight: 900;
        color: var(--mb-blue);
        word-break: break-all;
      }

      .mb-card.is-active .mb-card-answer {
        background: var(--mb-yellow-soft);
        border-color: var(--mb-yellow-line);
      }

      /* Square roots: 2 columns x 5 rows, one line per question */
      .mb-card-grid.mb-grid-roots {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 14px;
      }

      .mb-grid-roots .mb-card {
        min-height: 0;
        flex-direction: row;
        align-items: center;
        padding: 6px 10px 6px 34px;
      }

      .mb-grid-roots .mb-card-num {
        top: 50%;
        transform: translateY(-50%);
      }

      .mb-grid-roots .mb-card-problem {
        text-align: left;
        font-size: 17px;
      }

      .mb-grid-roots .mb-card-answer {
        min-width: 140px;
        font-size: 15px;
      }

      /* Workbench: enlarged active problem with step boxes and answer digit boxes */
      .mb-workbench {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        padding: var(--space-3) var(--space-4);
        background: var(--mb-panel);
        border: 2px solid var(--mb-line);
        border-radius: 14px;
      }

      .mb-workbench-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
      }

      .mb-qnum {
        font-size: 13px;
        font-weight: 900;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--mb-yellow);
        border: 1px solid var(--mb-yellow-line);
        color: var(--mb-ink);
      }

      .mb-workbench-hint {
        font-size: 11px;
        color: var(--mb-muted);
      }

      .mb-active-problem {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-4);
      }

      .mb-problem-zone {
        display: flex;
        justify-content: center;
        overflow-x: auto;
        max-width: 100%;
      }

      .mb-problem-grid {
        display: grid;
        gap: 4px;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .mb-board .comp-step-box.mb-step-box {
        width: var(--mb-cell);
        height: 26px;
        background: var(--mb-card);
        border-color: var(--mb-line);
        color: var(--mb-ink);
      }

      .mb-board .comp-step-box.mb-step-box.is-checked {
        background: var(--mb-yellow);
        border-color: var(--mb-yellow-line);
        box-shadow: inset 0 -3px 0 var(--mb-yellow-line);
      }

      .mb-board .comp-step-box.mb-step-box.is-next-target {
        border-style: dashed;
        border-color: var(--mb-blue);
      }

      .mb-digit {
        text-align: center;
        font-size: 2rem;
        line-height: 1.3;
        font-weight: 800;
        color: var(--mb-ink);
        border-radius: 5px;
      }

      .mb-digit.is-col-highlighted {
        background: var(--mb-yellow-soft);
        outline: 2px solid var(--mb-yellow-line);
      }

      .mb-digit-underline {
        border-bottom: 3px solid var(--mb-ink);
        border-radius: 0;
      }

      .mb-digit-overline {
        border-top: 3px solid var(--mb-ink);
        border-radius: 0;
      }

      .mb-digit-bracket {
        border-top: 3px solid var(--mb-ink);
        border-radius: 0;
      }

      .mb-divisor-cell + .mb-digit-bracket {
        border-left: 3px solid var(--mb-ink);
        border-top-left-radius: 12px;
      }

      .mb-op-sign,
      .mb-radical-sign {
        text-align: center;
        font-size: 2rem;
        font-weight: 900;
        color: var(--mb-blue);
        line-height: 1;
      }

      .mb-divisor-cell,
      .mb-divisor-inline {
        font-family: var(--font-mono);
        font-size: 2rem;
        font-weight: 800;
        padding-right: 8px;
        text-align: right;
        color: var(--mb-ink);
      }

      .mb-answer-zone {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        max-width: 100%;
      }

      .mb-answer-label {
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--mb-muted);
      }

      .mb-slots-row {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: nowrap;
      }

      .mb-board .additions-slot-box.mb-slot {
        width: var(--mb-cell);
        height: 48px;
        font-size: 1.5rem;
        background: var(--mb-yellow-soft);
        border-color: var(--mb-yellow-line);
        color: var(--mb-ink);
      }

      .mb-board .additions-slot-box.mb-slot.is-cursor {
        background: var(--mb-yellow);
        border-color: var(--mb-blue);
        border-bottom-width: 5px;
        box-shadow: 0 0 0 2px rgba(31, 95, 168, 0.25);
      }

      .mb-decimal-dot {
        font-family: var(--font-mono);
        font-size: 2rem;
        font-weight: 900;
        color: var(--mb-ink);
        padding: 0 2px;
      }

      /* Calendar and additions on the board palette */
      .mb-board .calendar-list-panel,
      .mb-board .calendar-active-panel,
      .mb-board .additions-workbench {
        background: var(--mb-panel);
        border: 2px solid var(--mb-line);
        color: var(--mb-ink);
      }

      .mb-board .calendar-list-item {
        background: var(--mb-card);
        border-color: var(--mb-line);
        color: var(--mb-ink);
      }

      .mb-board .calendar-list-item.is-answered {
        background: #eef6ff;
      }

      .mb-board .calendar-list-item.is-active-highlight {
        background: var(--mb-yellow);
        border: 2px solid var(--mb-yellow-line);
        border-left: 5px solid var(--mb-yellow-line);
        box-shadow: none;
      }

      .mb-board .calendar-active-date {
        background: var(--mb-yellow);
        border-color: var(--mb-yellow-line);
        color: var(--mb-ink);
      }

      .mb-board .calendar-day-btn {
        background: var(--mb-card);
        border-color: var(--mb-line);
        color: var(--mb-ink);
      }

      .mb-board .calendar-day-btn:hover {
        background: var(--mb-yellow-soft);
        border-color: var(--mb-yellow-line);
      }

      .mb-board .calendar-day-btn.is-selected {
        background: var(--mb-blue);
        border-color: var(--mb-blue);
        color: #ffffff;
      }

      .mb-board .additions-mini-card {
        background: var(--mb-card);
        border: 2px solid var(--mb-line);
        color: var(--mb-ink);
      }

      .mb-board .additions-mini-card.is-active {
        background: var(--mb-yellow);
        border: 2px solid var(--mb-yellow-line);
        box-shadow: 0 0 0 3px rgba(215, 180, 0, 0.35);
      }

      .mb-board .additions-mini-rows {
        color: var(--mb-ink);
      }

      .mb-board .additions-mini-answer {
        color: var(--mb-blue);
        border-top-color: var(--mb-ink);
      }

      .mb-board .additions-matrix {
        background: var(--mb-card);
        border-color: var(--mb-line);
      }

      .mb-board .additions-digit-cell,
      .mb-board .additions-row-idx {
        color: var(--mb-ink);
      }

      .mb-board .additions-digit-cell.is-col-highlighted {
        background: var(--mb-yellow-soft);
        color: var(--mb-ink);
        outline: 2px solid var(--mb-yellow-line);
      }

      .mb-board .additions-slot-box {
        background: var(--mb-yellow-soft);
        border-color: var(--mb-yellow-line);
        color: var(--mb-ink);
      }

      .mb-board .additions-slot-box.is-cursor {
        background: var(--mb-yellow);
        border-color: var(--mb-blue);
      }

      .mb-board .badge-active {
        background: var(--mb-yellow);
        color: var(--mb-ink);
        border: 1px solid var(--mb-yellow-line);
      }

      .mb-board code {
        color: var(--mb-ink);
      }

      @media (max-height: 760px) {
        .mb-card {
          min-height: 88px;
        }
        .mb-digit,
        .mb-op-sign,
        .mb-radical-sign,
        .mb-divisor-cell,
        .mb-divisor-inline {
          font-size: 1.6rem;
        }
      }
    </style>

    <meta name="theme-color" content="#2563EB" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trendz Tracker" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Top Bar Contract: 3-Zone Navigation (hidden during Concentration & Stage) -->
      <header class="app-header">
        <div class="container header-inner">
          <a href="/pages/student.html" class="brand-zone">
            <span class="brand-icon" aria-hidden="true">🧮</span>
            <span>Trendz Tracker</span>
          </a>

          <nav class="nav-zone" id="student-nav-zone" aria-label="Student Primary Navigation"></nav>

          <div class="actions-zone">
            <div class="meta-row" style="font-size: var(--text-xs); display: none;" id="user-pill-container">
              <span id="header-user-name" style="font-weight: 600; color: var(--text-main);">Student</span>
              <span class="meta-separator" aria-hidden="true">·</span>
              <span id="header-user-code" class="num" style="color: var(--text-muted);">STU</span>
            </div>
            <button type="button" id="btn-header-logout" class="btn btn-outline btn-sm">
              Sign Out
            </button>
          </div>
        </div>
      </header>

      <main class="main-content">
        <!-- Narrow Viewport Friendly Message (< 1000 px) -->
        <div class="memoriad-narrow-guard" role="region" aria-label="Desktop keyboard required">
          <div style="font-size: 2.25rem; margin-bottom: var(--space-3);" aria-hidden="true">⌨️</div>
          <h1 id="memoriad-narrow-guard-title" style="font-size: 1.35rem; margin-bottom: var(--space-2);">
            Use a laptop or desktop with a keyboard for this practice
          </h1>
          <p style="font-size: var(--text-sm); color: var(--text-muted); margin-bottom: var(--space-4);">
            The Memoriad competition stage requires at least a 1000&nbsp;px screen and a physical keyboard for high-speed numerical entry.
          </p>
          <a id="memoriad-narrow-guard-back" href="/pages/memoriad.html" class="btn btn-primary" style="text-decoration: none;">
            &larr; Back to Memoriad
          </a>
        </div>

        <!-- Desktop Competition App Root -->
        <div id="memoriad-desktop-app">
          <div class="container" id="memoriad-normal-container">
            <div id="config-banner-placeholder"></div>
            <div id="memoriad-view-root">
              <div class="loading-state" style="padding: var(--space-6);">
                Loading competition module settings...
              </div>
            </div>
          </div>

          <!-- Full-Viewport Stage Container (used during Concentration & Stage) -->
          <div id="memoriad-stage-root" style="display: none;"></div>
        </div>
      </main>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="/js/memoriadPlay.js"></script>
