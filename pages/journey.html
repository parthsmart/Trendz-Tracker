<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journey - Trendz Tracker</title>
    <meta name="description" content="Your mascot, your level island, boss rounds and the season leaderboard." />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/studentHome.css" />
    <link rel="stylesheet" href="/css/journey.css" />
    <script src="/theme-boot.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563EB" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trendz Tracker" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="container header-inner">
          <a href="/pages/student.html" class="brand-zone" id="header-brand-link">
            <span class="brand-icon" aria-hidden="true">🧮</span>
            <span>Trendz Tracker</span>
          </a>
          <button type="button" class="mobile-menu-btn" id="btn-mobile-menu" aria-label="Toggle Navigation" aria-expanded="false" style="display: none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <nav class="nav-zone" id="student-nav-zone" aria-label="Primary Navigation"></nav>
          <div class="actions-zone">
            <div class="meta-row" style="font-size: var(--text-xs); display: none;" id="user-pill-container">
              <span id="header-user-name" style="font-weight: 600; color: var(--text-main);">User</span>
              <span class="meta-separator" aria-hidden="true">·</span>
              <span id="header-user-code" class="num" style="color: var(--text-muted);">ID</span>
            </div>
            <button type="button" id="btn-header-logout" class="btn btn-outline btn-sm">Sign out</button>
          </div>
        </div>
      </header>

      <main class="main-content">
        <div class="container">
          <div id="config-banner-placeholder"></div>

          <div class="pg-head">
            <h1>🏝️ Journey</h1>
            <p id="jy-subtitle">Your mascot, your level island, boss rounds and the season leaderboard.</p>
          </div>

          <div id="jy-root" class="jy-page">
            <div class="loading-state">Loading your journey…</div>
          </div>
        </div>
      </main>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <script type="module" src="/js/journey.js"></script>
  </body>
</html>
