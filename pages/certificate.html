<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate - Trendz Tracker</title>
    <meta name="description" content="A printable certificate for a Trendz Tracker achievement." />

    <!-- Design tokens & unified styles -->
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/theme-boot.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563EB" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trendz Tracker" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Top Bar Contract: 3-Zone Navigation -->
      <header class="app-header">
        <div class="container header-inner">
          <!-- Zone 1: Wordmark & Brand -->
          <a href="/pages/student.html" class="brand-zone">
            <span class="brand-icon" aria-hidden="true">🧮</span>
            <span>Trendz Tracker</span>
          </a>

          <!-- Mobile Menu Toggle -->
          <button type="button" class="mobile-menu-btn" id="btn-mobile-menu" aria-label="Toggle Navigation" aria-expanded="false">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <!-- Zone 2: Navigation Links -->
          <nav class="nav-zone" id="student-nav-zone" aria-label="Student Primary Navigation"></nav>

          <!-- Zone 3: User Details & Logout Action -->
          <div class="actions-zone">
            <div class="meta-row" style="font-size: var(--text-xs); display: none;" id="user-pill-container">
              <span id="header-user-name" style="font-weight: 600; color: var(--text-main);">Student</span>
              <span class="meta-separator" aria-hidden="true">·</span>
              <span id="header-user-code" class="num" style="color: var(--text-muted);">STU</span>
            </div>
            <button type="button" id="btn-header-logout" class="btn btn-outline btn-sm">
              Sign Out
            </button>
          </div>
        </div>
      </header>

      <!-- Main Page Content -->
      <main class="main-content">
        <div class="container" style="max-width: 960px;">
          <div class="ce-actions">
            <a class="btn btn-outline btn-sm" href="/pages/profile.html" id="ce-back">← Back to profile</a>
            <button type="button" class="btn btn-primary btn-sm" id="ce-print" disabled>🖨️ Print or save as PDF</button>
          </div>
          <p class="ar-dim" id="ce-status">Loading certificate…</p>
          <article class="ce-sheet" id="ce-sheet" hidden>
            <div class="ce-border">
              <p class="ce-brand">🧮 Trendz</p>
              <p class="ce-kicker">Certificate of Achievement</p>
              <p class="ce-small">This certificate is proudly presented to</p>
              <h1 class="ce-name" id="ce-name"></h1>
              <p class="ce-small">for earning</p>
              <p class="ce-title"><span id="ce-icon" aria-hidden="true"></span> <span id="ce-title"></span></p>
              <p class="ce-detail" id="ce-detail"></p>
              <div class="ce-foot">
                <div><span id="ce-date"></span><i>Date</i></div>
                <div><span id="ce-level"></span><i>Level</i></div>
                <div><span>&nbsp;</span><i>Trainer</i></div>
              </div>
            </div>
          </article>
        </div>
      </main>
    </div>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <script type="module" src="/js/certificate.js"></script>
  </body>
</html>
