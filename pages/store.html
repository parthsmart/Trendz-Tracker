<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store - Trendz Tracker</title>
    <meta name="description" content="Spend your XP on rewards on Trendz Tracker." />

    <!-- Design tokens & unified styles -->
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/theme-boot.js"></script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563EB" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trendz Tracker" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Top Bar Contract: 3-Zone Navigation -->
      <header class="app-header">
        <div class="container header-inner">
          <!-- Zone 1: Wordmark & Brand -->
          <a href="/pages/student.html" class="brand-zone">
            <span class="brand-icon" aria-hidden="true">🧮</span>
            <span>Trendz Tracker</span>
          </a>

          <!-- Mobile Menu Toggle -->
          <button type="button" class="mobile-menu-btn" id="btn-mobile-menu" aria-label="Toggle Navigation" aria-expanded="false">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <!-- Zone 2: Navigation Links -->
          <nav class="nav-zone" id="student-nav-zone" aria-label="Student Primary Navigation"></nav>

          <!-- Zone 3: User Details & Logout Action -->
          <div class="actions-zone">
            <div class="meta-row" style="font-size: var(--text-xs); display: none;" id="user-pill-container">
              <span id="header-user-name" style="font-weight: 600; color: var(--text-main);">Student</span>
              <span class="meta-separator" aria-hidden="true">·</span>
              <span id="header-user-code" class="num" style="color: var(--text-muted);">STU</span>
            </div>
            <button type="button" id="btn-header-logout" class="btn btn-outline btn-sm">
              Sign Out
            </button>
          </div>
        </div>
      </header>

      <!-- Main Page Content -->
      <main class="main-content">
        <div class="container ar-container" style="max-width: 960px;">
          <div id="config-banner-placeholder"></div>
          <header class="ar-hero">
            <h1>🎁 Store</h1>
            <p class="ar-dim">Spend the XP you earn on rewards and collect them from your trainer at the centre. <a href="/pages/arena.html">Open the Arena ›</a></p>
          </header>

          <nav class="ar-tabs store-tabs" role="tablist" aria-label="Store sections">
            <button type="button" role="tab" class="ar-tab is-active" id="store-tab-prizes" aria-controls="store-pane-prizes" aria-selected="true">🎁 Prizes (XP)</button>
            <button type="button" role="tab" class="ar-tab" id="store-tab-avatar" aria-controls="store-pane-avatar" aria-selected="false">🙂 Avatar shop (coins)</button>
          </nav>

          <div id="store-pane-prizes" role="tabpanel" aria-labelledby="store-tab-prizes">

          <section class="card ar-panel" id="panel-rewards">
            <div id="ar-rewards"><p class="ar-dim">Loading…</p></div>
            <form class="ar-item-form" id="ar-item-form" hidden>
              <h3 class="ar-h3" id="ar-item-form-title">Add a reward</h3>
              <input type="hidden" name="id" />
              <label>Icon<input name="icon" maxlength="8" placeholder="🎁" /></label>
              <label class="ar-grow">Name<input name="name" maxlength="60" required placeholder="e.g. Pencil set" /></label>
              <label>XP cost<input name="cost" type="number" min="1" step="1" required /></label>
              <label>Stock<input name="stock" type="number" min="0" step="1" placeholder="unlimited" /></label>
              <label class="ar-full">Description<input name="description" maxlength="140" placeholder="Optional" /></label>
              <label class="ar-check"><input name="active" type="checkbox" checked /> Show in the shop</label>
              <div class="ar-full ar-form-actions">
                <button type="submit" class="btn btn-primary btn-sm">Save reward</button>
                <button type="button" class="btn btn-outline btn-sm" id="ar-item-reset">Clear</button>
              </div>
            </form>
          </section>
          </div>

          <div id="store-pane-avatar" role="tabpanel" aria-labelledby="store-tab-avatar" hidden>
            <section class="card ar-panel" id="panel-avatar-shop">
              <div id="av-shop"><p class="ar-dim">Loading…</p></div>
            </section>
          </div>
        </div>
      </main>
    </div>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <script type="module" src="/js/arena.js"></script>
    <script type="module" src="/js/avatarShop.js"></script>
  </body>
</html>
